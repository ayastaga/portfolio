<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" fill="none">
  <style>
    /* loops forever: build in, hold, fade out, restart */
    [class] { transform-box: fill-box; transform-origin: center; }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    @keyframes fadeInUp-file-1 {
      0%, 2.22% { opacity: 0; transform: translateY(16px); }
      8.89%, 88.89% { opacity: 1; transform: translateY(0); }
      95.56%, 99.9% { opacity: 0; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(16px); }
    }
    .file-1 { animation: fadeInUp-file-1 9s ease-out infinite; }
    @keyframes fadeInUp-file-2 {
      0%, 5.56% { opacity: 0; transform: translateY(16px); }
      12.22%, 88.89% { opacity: 1; transform: translateY(0); }
      95.56%, 99.9% { opacity: 0; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(16px); }
    }
    .file-2 { animation: fadeInUp-file-2 9s ease-out infinite; }
    @keyframes fadeInUp-file-3 {
      0%, 8.89% { opacity: 0; transform: translateY(16px); }
      15.56%, 88.89% { opacity: 1; transform: translateY(0); }
      95.56%, 99.9% { opacity: 0; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(16px); }
    }
    .file-3 { animation: fadeInUp-file-3 9s ease-out infinite; }
    @keyframes fadeInUp-file-4 {
      0%, 4.44% { opacity: 0; transform: translateY(16px); }
      11.11%, 88.89% { opacity: 1; transform: translateY(0); }
      95.56%, 99.9% { opacity: 0; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(16px); }
    }
    .file-4 { animation: fadeInUp-file-4 9s ease-out infinite; }
    @keyframes fadeInUp-file-5 {
      0%, 7.78% { opacity: 0; transform: translateY(16px); }
      14.44%, 88.89% { opacity: 1; transform: translateY(0); }
      95.56%, 99.9% { opacity: 0; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(16px); }
    }
    .file-5 { animation: fadeInUp-file-5 9s ease-out infinite; }
    @keyframes drawLine-arrow-line {
      0%, 13.33% { stroke-dashoffset: 120; opacity: 1; }
      22.22%, 88.89% { stroke-dashoffset: 0; opacity: 1; }
      95.56%, 99.9% { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 120; opacity: 1; }
    }
    .arrow-line { stroke-dasharray: 120; animation: drawLine-arrow-line 9s ease-out infinite; }
    @keyframes fadeIn-arrow-head {
      0%, 21.11% { opacity: 0; }
      24.44%, 88.89% { opacity: 1; }
      95.56%, 99.9% { opacity: 0; }
      100% { opacity: 0; }
    }
    .arrow-head { animation: fadeIn-arrow-head 9s ease-out infinite; }
    @keyframes scaleIn-center-box {
      0%, 15.56% { opacity: 0; transform: scale(0.92); }
      21.11%, 88.89% { opacity: 1; transform: scale(1); }
      95.56%, 99.9% { opacity: 0; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.92); }
    }
    .center-box { animation: scaleIn-center-box 9s ease-out infinite; }
    @keyframes drawLine-arrow-line-2 {
      0%, 22.22% { stroke-dashoffset: 120; opacity: 1; }
      31.11%, 88.89% { stroke-dashoffset: 0; opacity: 1; }
      95.56%, 99.9% { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 120; opacity: 1; }
    }
    .arrow-line-2 { stroke-dasharray: 120; animation: drawLine-arrow-line-2 9s ease-out infinite; }
    @keyframes fadeIn-arrow-head-2 {
      0%, 30.00% { opacity: 0; }
      33.33%, 88.89% { opacity: 1; }
      95.56%, 99.9% { opacity: 0; }
      100% { opacity: 0; }
    }
    .arrow-head-2 { animation: fadeIn-arrow-head-2 9s ease-out infinite; }
    @keyframes fadeIn-output-box {
      0%, 24.44% { opacity: 0; }
      31.11%, 88.89% { opacity: 1; }
      95.56%, 99.9% { opacity: 0; }
      100% { opacity: 0; }
    }
    .output-box { animation: fadeIn-output-box 9s ease-out infinite; }
    @keyframes typeIn-md-1 {
      0%, 28.89% { opacity: 0; transform: translateX(-6px); }
      33.33%, 88.89% { opacity: 1; transform: translateX(0); }
      95.56%, 99.9% { opacity: 0; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(-6px); }
    }
    .md-1 { animation: typeIn-md-1 9s ease-out infinite; }
    @keyframes typeIn-md-2 {
      0%, 31.11% { opacity: 0; transform: translateX(-6px); }
      35.56%, 88.89% { opacity: 1; transform: translateX(0); }
      95.56%, 99.9% { opacity: 0; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(-6px); }
    }
    .md-2 { animation: typeIn-md-2 9s ease-out infinite; }
    @keyframes typeIn-md-3 {
      0%, 33.33% { opacity: 0; transform: translateX(-6px); }
      37.78%, 88.89% { opacity: 1; transform: translateX(0); }
      95.56%, 99.9% { opacity: 0; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(-6px); }
    }
    .md-3 { animation: typeIn-md-3 9s ease-out infinite; }
    @keyframes typeIn-md-4 {
      0%, 35.56% { opacity: 0; transform: translateX(-6px); }
      40.00%, 88.89% { opacity: 1; transform: translateX(0); }
      95.56%, 99.9% { opacity: 0; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(-6px); }
    }
    .md-4 { animation: typeIn-md-4 9s ease-out infinite; }
    @keyframes typeIn-md-5 {
      0%, 37.78% { opacity: 0; transform: translateX(-6px); }
      42.22%, 88.89% { opacity: 1; transform: translateX(0); }
      95.56%, 99.9% { opacity: 0; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(-6px); }
    }
    .md-5 { animation: typeIn-md-5 9s ease-out infinite; }
    @keyframes typeIn-md-6 {
      0%, 40.00% { opacity: 0; transform: translateX(-6px); }
      44.44%, 88.89% { opacity: 1; transform: translateX(0); }
      95.56%, 99.9% { opacity: 0; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(-6px); }
    }
    .md-6 { animation: typeIn-md-6 9s ease-out infinite; }
    @keyframes typeIn-md-7 {
      0%, 42.22% { opacity: 0; transform: translateX(-6px); }
      46.67%, 88.89% { opacity: 1; transform: translateX(0); }
      95.56%, 99.9% { opacity: 0; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(-6px); }
    }
    .md-7 { animation: typeIn-md-7 9s ease-out infinite; }
    @keyframes typeIn-md-8 {
      0%, 44.44% { opacity: 0; transform: translateX(-6px); }
      48.89%, 88.89% { opacity: 1; transform: translateX(0); }
      95.56%, 99.9% { opacity: 0; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(-6px); }
    }
    .md-8 { animation: typeIn-md-8 9s ease-out infinite; }
    @keyframes fadeIn-title-text {
      0%, 0.00% { opacity: 0; }
      8.89%, 88.89% { opacity: 1; }
      95.56%, 99.9% { opacity: 0; }
      100% { opacity: 0; }
    }
    .title-text { animation: fadeIn-title-text 9s ease-out infinite; }
    .accent-pulse { animation: pulseGlow 3s ease-in-out 4s infinite; }
  </style>

  <rect width="1200" height="840" fill="#0a0a0a"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="840" fill="url(#grid)"/>

  <!-- Title -->
  <g class="title-text">
    <text x="600" y="115" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="44" font-weight="500" letter-spacing="0.03em">parsemd</text>
    <text x="600" y="152" text-anchor="middle" fill="#666" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400">Binary documents to clean, structured markdown</text>
  </g>

  <!-- Left: File type cards -->
  <!-- PDF -->
  <g class="file-1">
    <rect x="80" y="210" width="120" height="140" rx="8" fill="#141414" stroke="#ef6000" stroke-width="1.5"/>
    <text x="140" y="268" text-anchor="middle" fill="#ef6000" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="15" font-weight="600">.pdf</text>
    <rect x="102" y="288" width="76" height="3" rx="1.5" fill="#2a2a2a"/>
    <rect x="102" y="300" width="56" height="3" rx="1.5" fill="#2a2a2a"/>
    <rect x="102" y="312" width="66" height="3" rx="1.5" fill="#2a2a2a"/>
  </g>

  <!-- DOCX -->
  <g class="file-2">
    <rect x="80" y="375" width="120" height="140" rx="8" fill="#141414" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <text x="140" y="433" text-anchor="middle" fill="#777" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="15" font-weight="600">.docx</text>
    <rect x="102" y="453" width="76" height="3" rx="1.5" fill="#2a2a2a"/>
    <rect x="102" y="465" width="52" height="3" rx="1.5" fill="#2a2a2a"/>
    <rect x="102" y="477" width="64" height="3" rx="1.5" fill="#2a2a2a"/>
  </g>

  <!-- PPTX -->
  <g class="file-3">
    <rect x="80" y="540" width="120" height="140" rx="8" fill="#141414" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <text x="140" y="598" text-anchor="middle" fill="#777" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="15" font-weight="600">.pptx</text>
    <rect x="102" y="618" width="76" height="3" rx="1.5" fill="#2a2a2a"/>
    <rect x="102" y="630" width="60" height="3" rx="1.5" fill="#2a2a2a"/>
  </g>

  <!-- XLSX -->
  <g class="file-4">
    <rect x="230" y="280" width="120" height="140" rx="8" fill="#141414" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <text x="290" y="338" text-anchor="middle" fill="#777" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="15" font-weight="600">.xlsx</text>
    <rect x="252" y="358" width="76" height="3" rx="1.5" fill="#2a2a2a"/>
    <rect x="252" y="370" width="58" height="3" rx="1.5" fill="#2a2a2a"/>
    <rect x="252" y="382" width="68" height="3" rx="1.5" fill="#2a2a2a"/>
  </g>

  <!-- IMG -->
  <g class="file-5">
    <rect x="230" y="445" width="120" height="140" rx="8" fill="#141414" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <text x="290" y="503" text-anchor="middle" fill="#777" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="15" font-weight="600">.png</text>
    <rect x="258" y="523" width="64" height="42" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="276" cy="540" r="7" fill="#2a2a2a"/>
  </g>

  <!-- Arrow in -->
  <line x1="380" y1="420" x2="490" y2="420" stroke="#ef6000" stroke-width="2" class="arrow-line"/>
  <polygon points="488,414 502,420 488,426" fill="#ef6000" class="arrow-head"/>

  <!-- Center: parsemd processor -->
  <g class="center-box">
    <rect x="510" y="345" width="190" height="150" rx="12" fill="#141414" stroke="#ef6000" stroke-width="2"/>
    <rect x="510" y="345" width="190" height="150" rx="12" fill="#ef6000" fill-opacity="0.04"/>
    <text x="605" y="405" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="24" font-weight="600">parsemd</text>
    <text x="605" y="432" text-anchor="middle" fill="#ef6000" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="13" font-weight="500">binary → markdown</text>
    <rect x="550" y="450" width="110" height="1" fill="#ef6000" opacity="0.2"/>
    <text x="605" y="475" text-anchor="middle" fill="#555" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12">MIT License</text>
  </g>

  <!-- Arrow out -->
  <line x1="710" y1="420" x2="820" y2="420" stroke="#ef6000" stroke-width="2" class="arrow-line-2"/>
  <polygon points="818,414 832,420 818,426" fill="#ef6000" class="arrow-head-2"/>

  <!-- Right: Markdown output -->
  <g class="output-box">
    <rect x="840" y="230" width="280" height="380" rx="10" fill="#141414" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <!-- Terminal dots -->
    <circle cx="864" cy="254" r="5" fill="#ef6000" class="accent-pulse"/>
    <circle cx="880" cy="254" r="5" fill="#444"/>
    <circle cx="896" cy="254" r="5" fill="#444"/>
    <line x1="840" y1="272" x2="1120" y2="272" stroke="#1a1a1a" stroke-width="1"/>
  </g>

  <text x="864" y="300" fill="#ef6000" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="14" font-weight="600" class="md-1"># Document Title</text>
  <text x="864" y="326" fill="#666" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" class="md-2">Extracted content from the</text>
  <text x="864" y="344" fill="#666" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" class="md-3">source document, cleaned.</text>

  <text x="864" y="378" fill="#ef6000" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="14" font-weight="600" class="md-4">## Section</text>
  <text x="864" y="404" fill="#666" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" class="md-5">- Tables preserved</text>
  <text x="864" y="422" fill="#666" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" class="md-6">- Images extracted</text>
  <text x="864" y="440" fill="#666" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" class="md-7">- Formatting intact</text>

  <g class="md-8">
    <text x="864" y="474" fill="#555" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">```json</text>
    <text x="864" y="494" fill="#ef6000" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="500">{ "tables": 3, "images": 7 }</text>
    <text x="864" y="514" fill="#555" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">```</text>
    <rect x="864" y="535" width="196" height="1" fill="#2a2a2a"/>
    <text x="864" y="558" fill="#444" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">output.md — 2.4kb</text>
  </g>
</svg>
