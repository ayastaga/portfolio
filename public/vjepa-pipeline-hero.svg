<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" fill="none">
  <style>
    /* loops forever: build in, hold, fade out, restart */
    [class] { transform-box: fill-box; transform-origin: center; }
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }

    @keyframes fadeIn-title {
      0%, 0.00% { opacity: 0; }
      7.50%, 87.50% { opacity: 1; }
      95.00%, 99.9% { opacity: 0; }
      100% { opacity: 0; }
    }
    .title { animation: fadeIn-title 8s ease-out infinite; }
    @keyframes fadeInUp-stage-1 {
      0%, 3.75% { opacity: 0; transform: translateY(14px); }
      10.00%, 87.50% { opacity: 1; transform: translateY(0); }
      95.00%, 99.9% { opacity: 0; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(14px); }
    }
    .stage-1 { animation: fadeInUp-stage-1 8s ease-out infinite; }
    @keyframes fadeInUp-stage-2 {
      0%, 8.75% { opacity: 0; transform: translateY(14px); }
      15.00%, 87.50% { opacity: 1; transform: translateY(0); }
      95.00%, 99.9% { opacity: 0; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(14px); }
    }
    .stage-2 { animation: fadeInUp-stage-2 8s ease-out infinite; }
    @keyframes fadeInUp-stage-3 {
      0%, 13.75% { opacity: 0; transform: translateY(14px); }
      20.00%, 87.50% { opacity: 1; transform: translateY(0); }
      95.00%, 99.9% { opacity: 0; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(14px); }
    }
    .stage-3 { animation: fadeInUp-stage-3 8s ease-out infinite; }
    @keyframes fadeInUp-stage-4 {
      0%, 18.75% { opacity: 0; transform: translateY(14px); }
      25.00%, 87.50% { opacity: 1; transform: translateY(0); }
      95.00%, 99.9% { opacity: 0; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(14px); }
    }
    .stage-4 { animation: fadeInUp-stage-4 8s ease-out infinite; }
    @keyframes fadeInUp-stage-5 {
      0%, 23.75% { opacity: 0; transform: translateY(14px); }
      30.00%, 87.50% { opacity: 1; transform: translateY(0); }
      95.00%, 99.9% { opacity: 0; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(14px); }
    }
    .stage-5 { animation: fadeInUp-stage-5 8s ease-out infinite; }
    @keyframes drawArrow-conn-1 {
      0%, 11.25% { stroke-dashoffset: 80; opacity: 1; }
      17.50%, 87.50% { stroke-dashoffset: 0; opacity: 1; }
      95.00%, 99.9% { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 80; opacity: 1; }
    }
    .conn-1 { stroke-dasharray: 80; animation: drawArrow-conn-1 8s ease-out infinite; }
    @keyframes fadeIn-conn-1-head {
      0%, 16.25% { opacity: 0; }
      18.75%, 87.50% { opacity: 1; }
      95.00%, 99.9% { opacity: 0; }
      100% { opacity: 0; }
    }
    .conn-1-head { animation: fadeIn-conn-1-head 8s ease-out infinite; }
    @keyframes drawArrow-conn-2 {
      0%, 16.25% { stroke-dashoffset: 80; opacity: 1; }
      22.50%, 87.50% { stroke-dashoffset: 0; opacity: 1; }
      95.00%, 99.9% { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 80; opacity: 1; }
    }
    .conn-2 { stroke-dasharray: 80; animation: drawArrow-conn-2 8s ease-out infinite; }
    @keyframes fadeIn-conn-2-head {
      0%, 21.25% { opacity: 0; }
      23.75%, 87.50% { opacity: 1; }
      95.00%, 99.9% { opacity: 0; }
      100% { opacity: 0; }
    }
    .conn-2-head { animation: fadeIn-conn-2-head 8s ease-out infinite; }
    @keyframes drawArrow-conn-3 {
      0%, 21.25% { stroke-dashoffset: 80; opacity: 1; }
      27.50%, 87.50% { stroke-dashoffset: 0; opacity: 1; }
      95.00%, 99.9% { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 80; opacity: 1; }
    }
    .conn-3 { stroke-dasharray: 80; animation: drawArrow-conn-3 8s ease-out infinite; }
    @keyframes fadeIn-conn-3-head {
      0%, 26.25% { opacity: 0; }
      28.75%, 87.50% { opacity: 1; }
      95.00%, 99.9% { opacity: 0; }
      100% { opacity: 0; }
    }
    .conn-3-head { animation: fadeIn-conn-3-head 8s ease-out infinite; }
    @keyframes drawArrow-conn-4 {
      0%, 26.25% { stroke-dashoffset: 80; opacity: 1; }
      32.50%, 87.50% { stroke-dashoffset: 0; opacity: 1; }
      95.00%, 99.9% { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 80; opacity: 1; }
    }
    .conn-4 { stroke-dasharray: 80; animation: drawArrow-conn-4 8s ease-out infinite; }
    @keyframes fadeIn-conn-4-head {
      0%, 31.25% { opacity: 0; }
      33.75%, 87.50% { opacity: 1; }
      95.00%, 99.9% { opacity: 0; }
      100% { opacity: 0; }
    }
    .conn-4-head { animation: fadeIn-conn-4-head 8s ease-out infinite; }
    @keyframes fillBar-progress-fill {
      0%, 30.00% { transform: scaleX(0); opacity: 0.25; }
      45.00%, 87.50% { transform: scaleX(1); opacity: 0.25; }
      95.00%, 99.9% { transform: scaleX(1); opacity: 0; }
      100% { transform: scaleX(0); opacity: 0.25; }
    }
    .progress-fill { animation: fillBar-progress-fill 8s ease-out infinite; }
    @keyframes popIn-check {
      0%, 42.50% { opacity: 0; transform: scale(0.8); }
      47.50%, 87.50% { opacity: 1; transform: scale(1); }
      95.00%, 99.9% { opacity: 0; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.8); }
    }
    .check { animation: popIn-check 8s ease-out infinite; }
    @keyframes fadeIn-bottom-bar {
      0%, 35.00% { opacity: 0; }
      42.50%, 87.50% { opacity: 1; }
      95.00%, 99.9% { opacity: 0; }
      100% { opacity: 0; }
    }
    .bottom-bar { animation: fadeIn-bottom-bar 8s ease-out infinite; }
    .dot-pulse { animation: subtlePulse 2.5s ease-in-out 3.5s infinite; }
  </style>

  <rect width="1400" height="700" fill="#fafbfc"/>

  <!-- Subtle dot grid -->
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.7" fill="#94a3b8" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1400" height="700" fill="url(#dots)"/>

  <!-- Title -->
  <g class="title">
    <text x="700" y="72" text-anchor="middle" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="38" font-weight="500" letter-spacing="0.03em">vjepa_pipeline</text>
    <text x="700" y="104" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="14" font-weight="400">Production-grade data curation for V-JEPA world models</text>
  </g>

  <!-- Stage 1: Raw Video -->
  <g class="stage-1">
    <rect x="55" y="170" width="190" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="55" y="170" width="190" height="42" rx="12" fill="#f1f5f9"/>
    <rect x="55" y="200" width="190" height="12" fill="#f1f5f9"/>
    <text x="150" y="197" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" letter-spacing="0.08em">01 RAW VIDEO</text>

    <!-- Video frames stacked -->
    <rect x="85" y="235" width="55" height="38" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="95" y="245" width="55" height="38" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="105" y="255" width="55" height="38" rx="4" fill="#f0f9ff" stroke="#2563eb" stroke-width="1.5"/>
    <polygon points="124,265 124,283 138,274" fill="#2563eb" opacity="0.7"/>

    <text x="80" y="330" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">frames: 24fps</text>
    <text x="80" y="348" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">format: mp4/avi</text>
    <text x="80" y="366" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">batch: 1024</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="255" y1="290" x2="315" y2="290" stroke="#2563eb" stroke-width="1.5" class="conn-1"/>
  <polygon points="313,285 323,290 313,295" fill="#2563eb" class="conn-1-head"/>

  <!-- Stage 2: Sampling -->
  <g class="stage-2">
    <rect x="330" y="170" width="190" height="240" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.3"/>
    <rect x="330" y="170" width="190" height="42" rx="12" fill="#eff6ff"/>
    <rect x="330" y="200" width="190" height="12" fill="#eff6ff"/>
    <text x="425" y="197" text-anchor="middle" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" letter-spacing="0.08em">02 SAMPLING</text>

    <!-- Sampling grid -->
    <rect x="355" y="235" width="26" height="26" rx="4" fill="#2563eb" opacity="0.15" stroke="#2563eb" stroke-width="1"/>
    <rect x="387" y="235" width="26" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="419" y="235" width="26" height="26" rx="4" fill="#2563eb" opacity="0.15" stroke="#2563eb" stroke-width="1"/>
    <rect x="451" y="235" width="26" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="483" y="235" width="26" height="26" rx="4" fill="#2563eb" opacity="0.15" stroke="#2563eb" stroke-width="1"/>

    <rect x="355" y="267" width="26" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="387" y="267" width="26" height="26" rx="4" fill="#2563eb" opacity="0.15" stroke="#2563eb" stroke-width="1"/>
    <rect x="419" y="267" width="26" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="451" y="267" width="26" height="26" rx="4" fill="#2563eb" opacity="0.15" stroke="#2563eb" stroke-width="1"/>
    <rect x="483" y="267" width="26" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

    <text x="355" y="330" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">temporal: uniform</text>
    <text x="355" y="348" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">spatial: center</text>
    <text x="355" y="366" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">rate: 4fps</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="530" y1="290" x2="590" y2="290" stroke="#2563eb" stroke-width="1.5" class="conn-2"/>
  <polygon points="588,285 598,290 588,295" fill="#2563eb" class="conn-2-head"/>

  <!-- Stage 3: Filtering -->
  <g class="stage-3">
    <rect x="605" y="170" width="190" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="605" y="170" width="190" height="42" rx="12" fill="#f1f5f9"/>
    <rect x="605" y="200" width="190" height="12" fill="#f1f5f9"/>
    <text x="700" y="197" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" letter-spacing="0.08em">03 FILTERING</text>

    <!-- Filter funnel -->
    <polygon points="660,235 740,235 720,285 680,285" fill="none" stroke="#16a34a" stroke-width="1.5" opacity="0.6"/>
    <rect x="680" y="285" width="40" height="16" fill="none" stroke="#16a34a" stroke-width="1.5" opacity="0.6"/>

    <!-- Pass/fail dots -->
    <circle cx="675" cy="250" r="4" fill="#16a34a" opacity="0.8"/>
    <circle cx="693" cy="245" r="4" fill="#16a34a" opacity="0.8"/>
    <circle cx="710" cy="253" r="4" fill="#ef4444" opacity="0.4"/>
    <circle cx="725" cy="247" r="4" fill="#16a34a" opacity="0.8"/>

    <text x="630" y="338" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">quality: SSIM > 0.8</text>
    <text x="630" y="356" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">motion: optical flow</text>
    <text x="630" y="374" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">dedup: perceptual</text>
  </g>

  <!-- Arrow 3→4 -->
  <line x1="805" y1="290" x2="865" y2="290" stroke="#2563eb" stroke-width="1.5" class="conn-3"/>
  <polygon points="863,285 873,290 863,295" fill="#2563eb" class="conn-3-head"/>

  <!-- Stage 4: Augmentation -->
  <g class="stage-4">
    <rect x="880" y="170" width="190" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="880" y="170" width="190" height="42" rx="12" fill="#f1f5f9"/>
    <rect x="880" y="200" width="190" height="12" fill="#f1f5f9"/>
    <text x="975" y="197" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" letter-spacing="0.08em">04 AUGMENT</text>

    <!-- Transform cards -->
    <rect x="910" y="238" width="48" height="36" rx="4" fill="#f0f9ff" stroke="#2563eb" stroke-width="1" stroke-opacity="0.4" transform="rotate(4, 934, 256)"/>
    <rect x="960" y="238" width="48" height="36" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" stroke-opacity="0.4" transform="rotate(-3, 984, 256)"/>
    <rect x="910" y="282" width="48" height="36" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="960" y="282" width="48" height="36" rx="4" fill="#f0f9ff" stroke="#2563eb" stroke-width="1" stroke-opacity="0.4" transform="rotate(2, 984, 300)"/>

    <text x="905" y="348" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">crop: random</text>
    <text x="905" y="366" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">flip: horizontal</text>
    <text x="905" y="384" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">color: jitter</text>
  </g>

  <!-- Arrow 4→5 -->
  <line x1="1080" y1="290" x2="1140" y2="290" stroke="#16a34a" stroke-width="1.5" class="conn-4"/>
  <polygon points="1138,285 1148,290 1138,295" fill="#16a34a" class="conn-4-head"/>

  <!-- Stage 5: V-JEPA Ready -->
  <g class="stage-5">
    <rect x="1155" y="170" width="195" height="240" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect x="1155" y="170" width="195" height="42" rx="12" fill="#f0fdf4"/>
    <rect x="1155" y="200" width="195" height="12" fill="#f0fdf4"/>
    <text x="1252" y="197" text-anchor="middle" fill="#16a34a" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" letter-spacing="0.08em">05 V-JEPA READY</text>

    <!-- Progress bar -->
    <rect x="1180" y="232" width="145" height="12" rx="6" fill="#f1f5f9"/>
    <rect x="1180" y="232" width="135" height="12" rx="6" fill="#16a34a" opacity="0.25" class="progress-fill" style="transform-origin: left center"/>
    <text x="1180" y="266" fill="#16a34a" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="10" font-weight="500">94% complete</text>

    <text x="1180" y="292" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="13" font-weight="600">Dataset Stats</text>
    <text x="1180" y="312" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">clips: 48,230</text>
    <text x="1180" y="330" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">frames: 1.2M</text>
    <text x="1180" y="348" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">actions: 156 classes</text>
    <text x="1180" y="366" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">size: 847 GB</text>

    <rect x="1180" y="380" width="145" height="1" fill="#e2e8f0"/>
  </g>

  <!-- Checkmark -->
  <g class="check">
    <circle cx="1198" cy="400" r="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <polyline points="1193,400 1196,403 1203,397" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1212" y="404" fill="#16a34a" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="500">validated</text>
  </g>

  <!-- Bottom bar -->
  <g class="bottom-bar">
    <rect x="55" y="480" width="1295" height="80" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <text x="100" y="526" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" letter-spacing="0.06em">STACK</text>

    <rect x="160" y="510" width="72" height="28" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1" stroke-opacity="0.3"/>
    <text x="196" y="528" text-anchor="middle" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="500">Python</text>

    <rect x="244" y="510" width="76" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="282" y="528" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="500">PyTorch</text>

    <rect x="332" y="510" width="72" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="368" y="528" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="500">FFmpeg</text>

    <rect x="416" y="510" width="70" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="451" y="528" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="500">NumPy</text>

    <text x="1100" y="528" text-anchor="end" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">github.com/ayastaga/vjepa_pipeline</text>
    <text x="1300" y="528" text-anchor="end" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="400">MIT License</text>

    <!-- Pulsing dot -->
    <circle cx="1320" cy="522" r="4" fill="#16a34a" class="dot-pulse"/>
  </g>
</svg>
