<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" fill="none">
  <rect width="1400" height="700" fill="#0a0a0a"/>

  <!-- Subtle dot grid -->
  <defs>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1400" height="700" fill="url(#dots)"/>

  <!-- Title -->
  <text x="700" y="80" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="300" letter-spacing="0.05em">vjepa_pipeline</text>
  <text x="700" y="112" text-anchor="middle" fill="#666" font-family="monospace" font-size="13">Production-grade data curation for V-JEPA world models</text>

  <!-- Pipeline stages -->

  <!-- Stage 1: Raw Video -->
  <rect x="60" y="200" width="180" height="220" rx="10" fill="#141414" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="60" y="200" width="180" height="40" rx="10" fill="#1a1a1a"/>
  <rect x="60" y="226" width="180" height="1" fill="#333"/>
  <text x="150" y="226" text-anchor="middle" fill="#888" font-family="monospace" font-size="11" font-weight="bold">01 RAW VIDEO</text>

  <!-- Video frame representations -->
  <rect x="80" y="260" width="60" height="40" rx="3" fill="#1e1e1e" stroke="#333" stroke-width="1"/>
  <rect x="90" y="270" width="60" height="40" rx="3" fill="#1e1e1e" stroke="#333" stroke-width="1"/>
  <rect x="100" y="280" width="60" height="40" rx="3" fill="#1e1e1e" stroke="#ef6000" stroke-width="1" stroke-opacity="0.5"/>
  <polygon points="120,290 120,310 135,300" fill="#ef6000" opacity="0.6"/>

  <text x="85" y="360" fill="#555" font-family="monospace" font-size="10">frames: 24fps</text>
  <text x="85" y="375" fill="#555" font-family="monospace" font-size="10">format: mp4/avi</text>
  <text x="85" y="390" fill="#555" font-family="monospace" font-size="10">batch: 1024</text>

  <!-- Arrow 1→2 -->
  <line x1="250" y1="310" x2="310" y2="310" stroke="#ef6000" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="310,306 320,310 310,314" fill="#ef6000"/>

  <!-- Stage 2: Frame Sampling -->
  <rect x="330" y="200" width="180" height="220" rx="10" fill="#141414" stroke="#ef6000" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="330" y="200" width="180" height="40" rx="10" fill="#1a1a1a"/>
  <rect x="330" y="226" width="180" height="1" fill="#333"/>
  <text x="420" y="226" text-anchor="middle" fill="#ef6000" font-family="monospace" font-size="11" font-weight="bold">02 SAMPLING</text>

  <!-- Sampling visualization -->
  <rect x="355" y="260" width="24" height="24" rx="2" fill="#ef6000" opacity="0.7"/>
  <rect x="385" y="260" width="24" height="24" rx="2" fill="#222" stroke="#333" stroke-width="1"/>
  <rect x="415" y="260" width="24" height="24" rx="2" fill="#ef6000" opacity="0.7"/>
  <rect x="445" y="260" width="24" height="24" rx="2" fill="#222" stroke="#333" stroke-width="1"/>
  <rect x="475" y="260" width="24" height="24" rx="2" fill="#ef6000" opacity="0.7"/>

  <rect x="355" y="294" width="24" height="24" rx="2" fill="#222" stroke="#333" stroke-width="1"/>
  <rect x="385" y="294" width="24" height="24" rx="2" fill="#ef6000" opacity="0.7"/>
  <rect x="415" y="294" width="24" height="24" rx="2" fill="#222" stroke="#333" stroke-width="1"/>
  <rect x="445" y="294" width="24" height="24" rx="2" fill="#ef6000" opacity="0.7"/>
  <rect x="475" y="294" width="24" height="24" rx="2" fill="#222" stroke="#333" stroke-width="1"/>

  <text x="355" y="360" fill="#555" font-family="monospace" font-size="10">temporal: uniform</text>
  <text x="355" y="375" fill="#555" font-family="monospace" font-size="10">spatial: center</text>
  <text x="355" y="390" fill="#555" font-family="monospace" font-size="10">rate: 4fps</text>

  <!-- Arrow 2→3 -->
  <line x1="520" y1="310" x2="580" y2="310" stroke="#ef6000" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="580,306 590,310 580,314" fill="#ef6000"/>

  <!-- Stage 3: Filtering -->
  <rect x="600" y="200" width="180" height="220" rx="10" fill="#141414" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="600" y="200" width="180" height="40" rx="10" fill="#1a1a1a"/>
  <rect x="600" y="226" width="180" height="1" fill="#333"/>
  <text x="690" y="226" text-anchor="middle" fill="#888" font-family="monospace" font-size="11" font-weight="bold">03 FILTERING</text>

  <!-- Filter funnel -->
  <polygon points="650,260 730,260 710,320 670,320" fill="none" stroke="#ef6000" stroke-width="1" opacity="0.5"/>
  <rect x="670" y="320" width="40" height="20" fill="none" stroke="#ef6000" stroke-width="1" opacity="0.5"/>

  <!-- Pass/fail indicators -->
  <circle cx="660" cy="275" r="4" fill="#4ade80" opacity="0.7"/>
  <circle cx="680" cy="270" r="4" fill="#4ade80" opacity="0.7"/>
  <circle cx="700" cy="278" r="4" fill="#ef4444" opacity="0.5"/>
  <circle cx="715" cy="268" r="4" fill="#4ade80" opacity="0.7"/>

  <text x="625" y="375" fill="#555" font-family="monospace" font-size="10">quality: SSIM > 0.8</text>
  <text x="625" y="390" fill="#555" font-family="monospace" font-size="10">motion: optical flow</text>
  <text x="625" y="405" fill="#555" font-family="monospace" font-size="10">dedup: perceptual</text>

  <!-- Arrow 3→4 -->
  <line x1="790" y1="310" x2="850" y2="310" stroke="#ef6000" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="850,306 860,310 850,314" fill="#ef6000"/>

  <!-- Stage 4: Augmentation -->
  <rect x="870" y="200" width="180" height="220" rx="10" fill="#141414" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="870" y="200" width="180" height="40" rx="10" fill="#1a1a1a"/>
  <rect x="870" y="226" width="180" height="1" fill="#333"/>
  <text x="960" y="226" text-anchor="middle" fill="#888" font-family="monospace" font-size="11" font-weight="bold">04 AUGMENT</text>

  <!-- Augmentation transforms -->
  <rect x="900" y="260" width="45" height="35" rx="3" fill="#1e1e1e" stroke="#ef6000" stroke-width="1" stroke-opacity="0.4" transform="rotate(5, 922, 277)"/>
  <rect x="935" y="265" width="45" height="35" rx="3" fill="#1e1e1e" stroke="#ef6000" stroke-width="1" stroke-opacity="0.4" transform="scale(0.9) translate(100, 30)"/>
  <rect x="900" y="310" width="45" height="35" rx="3" fill="#1e1e1e" stroke="#ef6000" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="955" y="310" width="45" height="35" rx="3" fill="#1e1e1e" stroke="#ef6000" stroke-width="1" stroke-opacity="0.4" transform="rotate(-3, 977, 327)"/>

  <text x="895" y="375" fill="#555" font-family="monospace" font-size="10">crop: random</text>
  <text x="895" y="390" fill="#555" font-family="monospace" font-size="10">flip: horizontal</text>
  <text x="895" y="405" fill="#555" font-family="monospace" font-size="10">color: jitter</text>

  <!-- Arrow 4→5 -->
  <line x1="1060" y1="310" x2="1120" y2="310" stroke="#ef6000" stroke-width="1.5" stroke-dasharray="5 3"/>
  <polygon points="1120,306 1130,310 1120,314" fill="#ef6000"/>

  <!-- Stage 5: V-JEPA Output -->
  <rect x="1140" y="200" width="200" height="220" rx="10" fill="#141414" stroke="#ef6000" stroke-width="2"/>
  <rect x="1140" y="200" width="200" height="40" rx="10" fill="#ef6000" opacity="0.15"/>
  <rect x="1140" y="226" width="200" height="1" fill="#ef6000" opacity="0.3"/>
  <text x="1240" y="226" text-anchor="middle" fill="#ef6000" font-family="monospace" font-size="11" font-weight="bold">05 V-JEPA READY</text>

  <!-- Output representation -->
  <rect x="1165" y="255" width="150" height="14" rx="2" fill="#1e1e1e"/>
  <rect x="1165" y="255" width="135" height="14" rx="2" fill="#ef6000" opacity="0.3"/>
  <text x="1175" y="265" fill="#ef6000" font-family="monospace" font-size="9">████████████░ 94%</text>

  <text x="1165" y="300" fill="#ef6000" font-family="monospace" font-size="12" font-weight="bold">Dataset Stats</text>
  <text x="1165" y="320" fill="#888" font-family="monospace" font-size="10">clips: 48,230</text>
  <text x="1165" y="335" fill="#888" font-family="monospace" font-size="10">frames: 1.2M</text>
  <text x="1165" y="350" fill="#888" font-family="monospace" font-size="10">actions: 156 classes</text>
  <text x="1165" y="365" fill="#888" font-family="monospace" font-size="10">size: 847 GB</text>

  <rect x="1165" y="380" width="150" height="1" fill="#333"/>
  <text x="1165" y="400" fill="#4ade80" font-family="monospace" font-size="10">✓ validation passed</text>

  <!-- Bottom bar: tech stack -->
  <rect x="60" y="520" width="1280" height="100" rx="10" fill="#111111" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <text x="100" y="555" fill="#444" font-family="monospace" font-size="10">STACK</text>

  <rect x="160" y="540" width="70" height="26" rx="13" fill="transparent" stroke="#ef6000" stroke-width="1" stroke-opacity="0.4"/>
  <text x="195" y="557" text-anchor="middle" fill="#ef6000" font-family="monospace" font-size="10">Python</text>

  <rect x="245" y="540" width="70" height="26" rx="13" fill="transparent" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
  <text x="280" y="557" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">PyTorch</text>

  <rect x="330" y="540" width="70" height="26" rx="13" fill="transparent" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
  <text x="365" y="557" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">FFmpeg</text>

  <rect x="415" y="540" width="70" height="26" rx="13" fill="transparent" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
  <text x="450" y="557" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">NumPy</text>

  <text x="100" y="595" fill="#333" font-family="monospace" font-size="10">github.com/ayastaga/vjepa_pipeline</text>
  <text x="1240" y="595" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">MIT License</text>
</svg>
